<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Погодний дашборд</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Погодний дашборд</h1>
      <p>Перегляд поточної погоди та прогнозу</p>
    </header>

    <main>
      <section class="weather-search">
        <h2>Пошук погоди</h2>

        <form id="weather-search-form">
          <input
            type="text"
            id="weather-input"
            placeholder="Введіть назву міста"
            required
          />

          <button type="submit" class="search-button">Знайти</button>
        </form>

        <p class="error" style="display: none"></p>
      </section>

      <section
        id="current-weather"
        class="container-single-weather"
        style="display: none"
      >
        <h2>Поточна погода</h2>

        <div class="weather-info">
          <h3 class="city"></h3>

          <img class="weather-img" src="" alt="Погодні умови" />

          <p class="temp"></p>

          <p class="description"></p>
        </div>
      </section>

      <section
        id="forecast"
        class="container-forecast-weather"
        style="display: block"
      >
      </section>

      <section class="manual-weather">
        <h2>Додати власний запис про погоду</h2>

        <form id="weather-form">
          <label for="day">День:</label>
          <input
            type="text"
            id="day"
            placeholder="Наприклад, Понеділок"
            required
          />

          <label for="tempC">Температура (°C):</label>
          <input
            type="number"
            id="tempC"
            placeholder="Введіть температуру"
            required
          />

          <label for="description">Опис погоди:</label>
          <input
            type="text"
            id="description"
            placeholder="Наприклад, Сонячно"
            required
          />

          <button type="submit">Додати запис</button>
        </form>

        <div id="records-list"></div>

        <button type="button" id="hottest-day-button">
          Знайти найтепліший день
        </button>

        <p id="hottest-day-result"></p>
      </section>

      <section class="api-weather">
        <h2>Дані Open-Meteo API</h2>

        <button type="button" id="update-weather-button">Оновити погоду</button>

        <p id="loading-message" style="display: none"></p>

        <p id="api-error" style="display: none"></p>

        <p id="api-temperature"></p>

        <p id="api-description"></p>

        <p id="api-time"></p>
      </section>
    </main>

    <footer>
      <p>Погодний дашборд</p>
    </footer>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" src="js/app.js"></script>
  </body>
</html>
